[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
description = "RustShot application: tray, hotkeys, overlay, flyout, recording toolbar, settings, dev CLI."
default-run = "rustshot"

[lints]
workspace = true

[[bin]]
name = "rustshot"
path = "src/main.rs"

[dependencies]
capture-core.workspace = true
recorder.workspace = true
imaging.workspace = true
config.workspace = true

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
clap.workspace = true
tray-icon.workspace = true
global-hotkey.workspace = true
arboard = { workspace = true, features = ["image-data"] }
rfd.workspace = true

[build-dependencies]
embed-resource = "3.0.1"

[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
