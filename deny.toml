# cargo-deny policy for RustShot. Run with: cargo deny check
# Install once: cargo install cargo-deny

[advisories]
# Fail on known security advisories for any dependency in the tree.
yanked = "deny"

[licenses]
# Allow the permissive licenses our dependency tree uses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
# Warn when the same crate appears at multiple versions (bloat/duplication).
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io is an allowed registry.
unknown-registry = "deny"
unknown-git = "deny"
