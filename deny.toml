# cargo-deny policy for RustShot. Run with: cargo deny check
# Install once: cargo install cargo-deny

[graph]
# RustShot ships only on Windows. Restricting the graph to the target we build drops the
# Linux-only GTK subtree pulled in by tray-icon (gtk/glib/proc-macro-error etc.), which we
# never compile and which otherwise adds spurious advisories/licenses/duplicates.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Fail on known security advisories for any dependency in the tree.
yanked = "deny"

[licenses]
# Allow the permissive licenses our (Windows) dependency tree uses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Warn when the same crate appears at multiple versions (bloat/duplication).
multiple-versions = "warn"
# Deny `*` version requirements — except the workspace's own internal path crates.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io is an allowed registry.
unknown-registry = "deny"
unknown-git = "deny"
