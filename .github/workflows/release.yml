name: Release

# Publishes a GitHub release with the portable zip when a version tag is pushed. Run it by hand
# (Actions → Release → Run workflow) to (re)attach the zip to an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.1.4)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      # A tag push gets no CI run (CI filters on branches), so the release re-runs the gate.
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Tag matches the workspace version
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $m.Matches.Groups[1].Value
          if ($env:TAG -ne "v$version") {
            throw "tag '$env:TAG' does not match the workspace version '$version' (expected 'v$version')"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Dependency policy (cargo-deny)
        run: cargo deny check
      - name: Package (portable zip)
        shell: pwsh
        run: pwsh -File scripts/build-portable.ps1
      - name: Checksum
        shell: pwsh
        run: |
          $zip = "dist/RustShot-$env:RELEASE_VERSION-portable-x64.zip"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum format, so `sha256sum -c` works on it.
          "$hash *$(Split-Path $zip -Leaf)" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline
          Get-Content "$zip.sha256"
      # `--notes-from-tag` reads the annotated tag message; make sure the tag object itself is
      # here (not a lightweight copy of it).
      - name: Fetch the tag object
        run: git fetch --force origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(
            "dist/RustShot-$env:RELEASE_VERSION-portable-x64.zip",
            "dist/RustShot-$env:RELEASE_VERSION-portable-x64.zip.sha256"
          )
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # The release exists (e.g. created by hand): replace its assets, keep its notes.
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --title "RustShot $env:TAG" --verify-tag --notes-from-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
