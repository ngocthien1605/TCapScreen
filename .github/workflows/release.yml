name: Release

# Publishes a GitHub release with the portable zip when a version tag is pushed. Run it by hand
# (Actions → Release → Run workflow) to (re)attach the zip to an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.1.4)'
        required: true
      toolchain:
        description: 'Rust toolchain to build with (blank = the tag''s rust-toolchain.toml)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      # A tag push gets no CI run (CI filters on branches), so the release re-runs the gate.
      # The toolchain step is inline (not the repo's composite action) so it also works for a
      # tag checked out from before that action existed.
      - name: Install toolchain from rust-toolchain.toml
        shell: pwsh
        env:
          TOOLCHAIN_OVERRIDE: ${{ inputs.toolchain }}
        run: |
          $ch = $env:TOOLCHAIN_OVERRIDE
          if (-not $ch) {
            $m = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"' | Select-Object -First 1
            if (-not $m) { throw 'rust-toolchain.toml has no channel' }
            $ch = $m.Matches.Groups[1].Value
          }
          rustup toolchain install $ch --no-self-update --profile minimal -c rustfmt,clippy -t x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "rustup failed to install $ch" }
          rustup default $ch
          # Outranks rust-toolchain.toml, so an override really is used.
          "RUSTUP_TOOLCHAIN=$ch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          rustc --version
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Tag matches the workspace version
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $m.Matches.Groups[1].Value
          if ($env:TAG -ne "v$version") {
            throw "tag '$env:TAG' does not match the workspace version '$version' (expected 'v$version')"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Dependency policy (cargo-deny)
        run: cargo deny check
      - name: Package (portable zip)
        shell: pwsh
        run: pwsh -File scripts/build-portable.ps1
      - name: Checksum
        shell: pwsh
        run: |
          $zip = "dist/RustShot-$env:RELEASE_VERSION-portable-x64.zip"
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum format, so `sha256sum -c` works on it.
          [IO.File]::WriteAllText("$PWD/$zip.sha256", "$hash *$(Split-Path $zip -Leaf)`n")
          Get-Content "$zip.sha256"
      # The release notes come from the annotated tag message; make sure the tag object itself
      # is here (not a lightweight copy of it).
      - name: Fetch the tag object
        run: git fetch --force origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `gh release view` failing is an expected answer here, not an error.
          $PSNativeCommandUseErrorActionPreference = $false
          $files = @(
            "dist/RustShot-$env:RELEASE_VERSION-portable-x64.zip",
            "dist/RustShot-$env:RELEASE_VERSION-portable-x64.zip.sha256"
          )
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # The release exists (e.g. created by hand): replace its assets, keep its notes.
            gh release upload $env:TAG @files --clobber
          } else {
            # Notes = the annotated tag message minus its subject line, which repeats the title.
            $notes = (git tag -l --format='%(contents:body)' $env:TAG | Out-String).Trim()
            if (-not $notes) { $notes = (git tag -l --format='%(contents)' $env:TAG | Out-String).Trim() }
            [IO.File]::WriteAllText("$PWD/release-notes.md", "$notes`n")
            gh release create $env:TAG @files --title "RustShot $env:TAG" --verify-tag --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
